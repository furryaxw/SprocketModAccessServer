services:
  access-server:
    build: .
    # 前后端同源同端口：容器里就是同一个 uvicorn 进程提供界面（/admin）与客户端接口（/v1、/ws）。
    ports:
      - "8787:8787"
    environment:
      SMAS_SERVER_ID: ${SMAS_SERVER_ID:-development-server}
      SMAS_SERVER_NAME: ${SMAS_SERVER_NAME:-Sprocket Developer Server}
      # 对外可达的地址；反代终止 TLS 时必须填，否则索引里会发出内网 http 地址。
      SMAS_PUBLIC_BASE_URL: ${SMAS_PUBLIC_BASE_URL:-}
      SMAS_SESSION_PEPPER: ${SMAS_SESSION_PEPPER:?set SMAS_SESSION_PEPPER}
      SMAS_KEY_PEPPER: ${SMAS_KEY_PEPPER:?set SMAS_KEY_PEPPER}
      SMAS_DOWNLOAD_TOKEN_SECRET: ${SMAS_DOWNLOAD_TOKEN_SECRET:?set SMAS_DOWNLOAD_TOKEN_SECRET}
      SMAS_SIGNING_KEY_ID: ${SMAS_SIGNING_KEY_ID:?set SMAS_SIGNING_KEY_ID}
      SMAS_SIGNING_PRIVATE_KEY_FILE: /app/data/secrets/signing-key.pem
      SMAS_PLATFORM_MODE: ${SMAS_PLATFORM_MODE:-simple}
      SMAS_AUTO_REGISTER_USERS: ${SMAS_AUTO_REGISTER_USERS:-true}
      SMAS_FIRST_LOGIN_PERMISSION_TEMPLATE: ${SMAS_FIRST_LOGIN_PERMISSION_TEMPLATE:-template.owner}
      SMAS_NEW_USER_PERMISSION_TEMPLATE: ${SMAS_NEW_USER_PERMISSION_TEMPLATE:-template.user}
      SMAS_SERVICE_ACCOUNTS: ${SMAS_SERVICE_ACCOUNTS:-}
      SMAS_GITHUB_API_URL: ${SMAS_GITHUB_API_URL:-https://api.github.com}
      SMAS_GITHUB_CLIENT_ID: ${SMAS_GITHUB_CLIENT_ID:-}
      SMAS_GITHUB_CLIENT_SECRET: ${SMAS_GITHUB_CLIENT_SECRET:-}
      SMAS_GITHUB_CALLBACK_URL: ${SMAS_GITHUB_CALLBACK_URL:-}
      SMAS_FRONTEND_ORIGIN: ${SMAS_FRONTEND_ORIGIN:-}
      SMAS_WS_ALLOWED_ORIGINS: ${SMAS_WS_ALLOWED_ORIGINS:-}
      # 对象存储：s3://<bucket>/<prefix> 或 s3+https://<endpoint>/<bucket>/<prefix>；file: 走本地卷。
      SMAS_OBJECT_STORAGE_URL: ${SMAS_OBJECT_STORAGE_URL:-file:./data/packages}
      SMAS_S3_BUCKET: ${SMAS_S3_BUCKET:-}
      SMAS_S3_REGION: ${SMAS_S3_REGION:-auto}
      SMAS_S3_FORCE_PATH_STYLE: ${SMAS_S3_FORCE_PATH_STYLE:-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # 302 下载源与签名有效期；桶的 origin 会自动推导，额外来源（CDN 等）写这里。
      SMAS_DOWNLOAD_ORIGINS: ${SMAS_DOWNLOAD_ORIGINS:-}
      SMAS_DOWNLOAD_URL_TTL: ${SMAS_DOWNLOAD_URL_TTL:-300}
      SMAS_DOWNLOAD_TOKEN_TTL: ${SMAS_DOWNLOAD_TOKEN_TTL:-120}
      SMAS_SMTP_HOST: ${SMAS_SMTP_HOST:-}
      SMAS_SMTP_PORT: ${SMAS_SMTP_PORT:-587}
      SMAS_SMTP_USERNAME: ${SMAS_SMTP_USERNAME:-}
      SMAS_SMTP_PASSWORD: ${SMAS_SMTP_PASSWORD:-}
      SMAS_SMTP_USE_TLS: ${SMAS_SMTP_USE_TLS:-1}
      SMAS_EMAIL_FROM: ${SMAS_EMAIL_FROM:-}
      SMAS_EMAIL_POLL_INTERVAL: ${SMAS_EMAIL_POLL_INTERVAL:-15}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
